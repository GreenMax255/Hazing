// ==========================================================
// [구조 변경] 이제부터는 문(door)과 출구(exit) 정보를
// 사람이 손으로 배열에 적지 않고, map 배열만 보고 자동으로 만들어냅니다.
// 맵 에디터로 맵을 새로 그릴 때마다 이 부분을 다시 손볼 필요가 없어집니다.
// ==========================================================

// 특정 좌표(x, y)의 칸이 "벽 종류(빈 바닥이 아닌 칸)"인지 확인해주는 도우미 함수입니다.
// 문이 가로 방향인지 세로 방향인지 판단할 때, 주변 칸이 벽인지 확인하는 용도로 씁니다.
function isWallLikeCell(x, y) {
  // map[y]가 아예 존재하지 않으면(맵 범위를 벗어난 경우)
  const row = map[y];
  if (!row) {
    // 맵 밖은 안전하게 "벽이다"라고 취급합니다.
    return true;
  }

  // 그 줄(row) 안에서 x번째 칸의 값을 가져옵니다.
  const cell = row[x];

  // 그 칸도 존재하지 않으면(가로 범위를 벗어난 경우) 마찬가지로 벽으로 취급합니다.
  if (cell === undefined) {
    return true;
  }

  // 값이 0이 아니라면(1, 2, 3, 4, 5 중 하나라면) 벽 종류로 판단합니다.
  // 0은 사람이 걸어다닐 수 있는 빈 바닥 칸이라는 뜻입니다.
  return cell !== 0;
}

// map 배열 전체를 훑으면서 값이 4(문)인 칸을 전부 찾아서,
// { x, y, open, dir } 형태의 문 데이터 목록을 자동으로 만들어주는 함수입니다.
function generateDoorsFromMap() {
  // 찾아낸 문들을 담을 빈 배열을 준비합니다.
  const generatedDoors = [];

  // map은 [세로줄][가로줄] 형태의 2차원 배열이므로,
  // 바깥 반복문은 세로줄(y)을 하나씩 살펴봅니다.
  for (let y = 0; y < map.length; y++) {
    // 안쪽 반복문은 그 세로줄 안에서 가로칸(x)을 하나씩 살펴봅니다.
    for (let x = 0; x < map[y].length; x++) {

      // 지금 보고 있는 칸이 4(문)가 아니라면 관심 없으니 건너뜁니다.
      if (map[y][x] !== 4) {
        continue; // continue는 "이번 반복은 여기서 그만하고 다음 칸으로 넘어가라"는 뜻입니다.
      }

      // 문의 왼쪽 칸과 오른쪽 칸이 둘 다 벽인지 확인합니다.
      const leftIsWall = isWallLikeCell(x - 1, y);
      const rightIsWall = isWallLikeCell(x + 1, y);

      // 문의 위쪽 칸과 아래쪽 칸이 둘 다 벽인지 확인합니다.
      const topIsWall = isWallLikeCell(x, y - 1);
      const bottomIsWall = isWallLikeCell(x, y + 1);

      // 왼쪽/오른쪽이 벽으로 막혀있다면 "가로(horizontal)" 방향 문으로 판단하고,
      // 위/아래가 벽으로 막혀있다면 "세로(vertical)" 방향 문으로 판단합니다.
      let direction = "horizontal"; // 혹시 판단이 애매할 경우를 대비한 기본값입니다.

      if (leftIsWall && rightIsWall) {
        direction = "horizontal";
      } else if (topIsWall && bottomIsWall) {
        direction = "vertical";
      }

      // 문 하나의 정보를 { x, y, open, dir } 형태로 만들어서 목록에 추가합니다.
      // x, y에 0.5를 더하는 이유는, 타일 하나의 "정중앙" 좌표를 쓰기 위해서입니다.
      generatedDoors.push({
        x: x + 0.5,
        y: y + 0.5,
        open: false,
        dir: direction
      });
    }
  }

  // 다 찾은 문 목록을 함수 밖으로 돌려줍니다.
  return generatedDoors;
}

// map 배열에서 값이 5(출구)인 칸을 전부 찾아서,
// { x, y, block } 형태의 출구 데이터 목록을 자동으로 만들어주는 함수입니다.
function generateExitsFromMap() {
  const generatedExits = [];

  for (let y = 0; y < map.length; y++) {
    for (let x = 0; x < map[y].length; x++) {

      // 5(출구)가 아니면 건너뜁니다.
      if (map[y][x] !== 5) {
        continue;
      }

      // 출구 하나의 정보를 { x, y, block } 형태로 만들어서 목록에 추가합니다.
      generatedExits.push({
        x: x + 0.5,
        y: y + 0.5,
        block: false
      });
    }
  }

  return generatedExits;
}

// ----------------------------------------------------------
// 이제 실제로 사용할 doors, exits 배열을,
// 손으로 적는 대신 위에서 만든 함수를 실행한 결과로 채웁니다.
// 앞으로 map 배열만 바꾸면 doors와 exits는 자동으로 따라서 바뀝니다.
// ----------------------------------------------------------
const doors = generateDoorsFromMap();
const exits = generateExitsFromMap();

// doors 배열을 빠르게 찾아보기 위한 Map을 만듭니다.
// (이 부분은 기존 코드와 완전히 동일한 방식입니다. doors의 내용물만 자동 생성으로 바뀐 것뿐입니다.)
const doorMap = new Map();
doors.forEach(d => doorMap.set(`${Math.floor(d.x)},${Math.floor(d.y)}`, d));

// exits 배열도 마찬가지로 빠르게 찾아보기 위한 Map을 만듭니다.
const exitMap = new Map();
exits.forEach(e => exitMap.set(`${Math.floor(e.x)},${Math.floor(e.y)}`, e));

// 잘 만들어졌는지 확인할 수 있도록, 콘솔(F12 -> Console 탭)에 개수를 출력해봅니다.
console.log("[자동 생성 적용] 문 개수:", doors.length);
console.log("[자동 생성 적용] 출구 개수:", exits.length);


    let player = {
      x: 58.5,
      y: 63.5,
      angle: -Math.PI / 2
    };

    const FOV = Math.PI / 3;
    let stamina = 100; 
    const maxStamina = 100; 
    let isRunning = false;

    
    const keys = {};
    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    
    window.addEventListener("keydown", e => {
      if (e.key >= "1" && e.key <= "5") {
        selectedSlot = parseInt(e.key) - 1;
      }
    });

    
    canvas.addEventListener("click", () => {
      canvas.requestPointerLock();

      let tx = player.x + Math.cos(player.angle);
      let ty = player.y + Math.sin(player.angle);

      
      for (let door of doors) {
        if (Math.abs(tx - door.x) < 0.5 && Math.abs(ty - door.y) < 0.5) {
          door.open = !door.open;
        }
      }

      
      for (let exit of exits) {
        if (Math.abs(tx - exit.x) < 0.5 && Math.abs(ty - exit.y) < 0.5) {
          exit.block = !exit.block;
        }
      }
    });

    window.addEventListener("mousedown", () => { isClicking = true; });
    window.addEventListener("mouseup", () => { isClicking = false; });

    
    let mouseDeltaX = 0;
    document.addEventListener("mousemove", (e) => {
      if (document.pointerLockElement === canvas) {
        mouseDeltaX += e.movementX;
      }
    });

    
    function doorCollision(x, y) {
      let tileX = Math.floor(x);
      let tileY = Math.floor(y);

      let door = doorMap.get(`${tileX},${tileY}`);
      if (!door) return false;

      let dx = x - door.x;
      let dy = y - door.y;

      if (!door.open) {
        return Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5;
      }

      if (door.dir === "horizontal") {
        if (Math.abs(dy) < 0.5) {
          return Math.abs(dx) >= DOOR_OPEN_WIDTH;
        }
      }

      if (door.dir === "vertical") {
        if (Math.abs(dx) < 0.5) {
          return Math.abs(dy) >= DOOR_OPEN_WIDTH;
        }
      }

      return false;
    }

    function isWall(x, y) {
      const cell = map[Math.floor(y)]?.[Math.floor(x)];
      if (cell === undefined) return true;

      if (cell === 4) {
        return doorCollision(x, y);
      }

      return [1, 2, 3, 5].includes(cell);
    }

    
    function move() {
      let speed = 0.03;
      let runMultiplier = 2.0;

      isRunning = keys["shift"] && stamina > 0.0;
      runMultiplier = (stamina <= 1) ? 1.0 : 4.0;

      if (isRunning) {
        speed *= runMultiplier;
      }

      let dx = 0;
      let dy = 0;

      if (keys["w"]) {
        dx += Math.cos(player.angle);
        dy += Math.sin(player.angle);
      }
      if (keys["s"]) {
        dx -= Math.cos(player.angle);
        dy -= Math.sin(player.angle);
      }
      if (keys["a"]) {
        dx += Math.cos(player.angle - Math.PI / 2);
        dy += Math.sin(player.angle - Math.PI / 2);
      }
      if (keys["d"]) {
        dx += Math.cos(player.angle + Math.PI / 2);
        dy += Math.sin(player.angle + Math.PI / 2);
      }

      
      if (mouseDeltaX !== 0) {
        let rotation = mouseDeltaX * MOUSE_SENSITIVITY;


        let clampedRotation = Math.max(-MAX_ROTATION_PER_FRAME, Math.min(MAX_ROTATION_PER_FRAME, rotation));

        player.angle += clampedRotation;
        mouseDeltaX = 0;
      }

      
      let dist = Math.sqrt(dx * dx + dy * dy); 


      const MIN_MOVE_THRESHOLD = 0.0001; 

      if (dist > MIN_MOVE_THRESHOLD) {   
        dx = (dx / dist) * speed;        
        dy = (dy / dist) * speed;
      } else {
        
        dx = 0;
        dy = 0;
      }
      
      tryMove(dx, dy);

      
      if (isRunning && (dx !== 0 || dy !== 0)) {
        stamina -= 0.25;
      } else {
        stamina += 0.2;
      }

      stamina = Math.max(0, Math.min(stamina, maxStamina));
    }

    function tryMove(dx, dy) {
      let newX = player.x + dx;
      let newY = player.y + dy;

      if (!isWall(newX, player.y)) player.x = newX;
      if (!isWall(player.x, newY)) player.y = newY;
    }

    function checkInteract() {
      let tx = player.x + Math.cos(player.angle);
      let ty = player.y + Math.sin(player.angle);

      canInteract = false;

      for (let door of doors) {
        if (Math.abs(tx - door.x) < 0.5 && Math.abs(ty - door.y) < 0.5) {
          canInteract = true;
          return;
        }
      }

      for (let exit of exits) {
        if (Math.abs(tx - exit.x) < 0.5 && Math.abs(ty - exit.y) < 0.5) {
          canInteract = true;
          return;
        }
      }
    }

    
    const STRIP_WIDTH = 2; 

    function castRays() {
      let { renderW, renderH } = { renderW: canvas.width, renderH: canvas.height };
      let projectionPlane = (renderW / 2) / Math.tan(FOV / 2);

      for (let i = 0; i < renderW; i += STRIP_WIDTH) {
        let cameraX = 2 * i / renderW - 1;
        let rayDirX = Math.cos(player.angle) + (-Math.sin(player.angle) * Math.tan(FOV / 2)) * cameraX;
        let rayDirY = Math.sin(player.angle) + (Math.cos(player.angle) * Math.tan(FOV / 2)) * cameraX;

        let mapX = Math.floor(player.x);
        let mapY = Math.floor(player.y);
        let deltaDistX = Math.abs(1 / rayDirX);
        let deltaDistY = Math.abs(1 / rayDirY);

        let stepX = (rayDirX < 0) ? -1 : 1;
        let sideDistX = (rayDirX < 0) ? (player.x - mapX) * deltaDistX : (mapX + 1 - player.x) * deltaDistX;
        let stepY = (rayDirY < 0) ? -1 : 1;
        let sideDistY = (rayDirY < 0) ? (player.y - mapY) * deltaDistY : (mapY + 1 - player.y) * deltaDistY;

        let hit = 0, side = 0, hitType = 0;

        while (hit === 0) {
          if (sideDistX < sideDistY) {
            sideDistX += deltaDistX;
            mapX += stepX;
            side = 0;
          } else {
            sideDistY += deltaDistY;
            mapY += stepY;
            side = 1;
          }

          let cell = map[mapY]?.[mapX];
          if (cell === undefined) break;

          if (cell === 4) {
            let door = doorMap.get(`${mapX},${mapY}`);
            if (!door) continue;

            let hitWorld = (side === 0) 
              ? player.y + (sideDistX - deltaDistX) * rayDirY 
              : player.x + (sideDistY - deltaDistY) * rayDirX;

            let doorLocal = (door.dir === "horizontal") 
              ? hitWorld - door.x + 0.5 
              : hitWorld - door.y + 0.5;

            if (!door.open) {
              hit = 1;
              hitType = 4;
            } else if (Math.abs(doorLocal - 0.5) >= DOOR_OPEN_WIDTH) {
              hit = 1;
              hitType = 4;
            }
          } else if ([1, 2, 3, 5].includes(cell)) {
            hit = 1; 
            hitType = cell;
          }
        }

        if (hit === 1) {
          let perpWallDist = (side === 0) ? (sideDistX - deltaDistX) : (sideDistY - deltaDistY);
          let wallHeight = projectionPlane / perpWallDist;

          let wallX = (side === 0) 
            ? player.y + perpWallDist * rayDirY 
            : player.x + perpWallDist * rayDirX;
          wallX -= Math.floor(wallX);

          let texture = wallTexture;
          if (hitType === 2) texture = windowTexture;
          if (hitType === 3) texture = wall3Texture;
          if (hitType === 4) {
            let door = doorMap.get(`${mapX},${mapY}`);
            texture = (door && door.open) ? roomDoorOpenTexture : roomDoorTexture;
          }
          if (hitType === 5) {
            let exit = exitMap.get(`${mapX},${mapY}`);
            texture = (exit && exit.block) ? blockedExitTexture : exitDoorTexture;
          }

          let textureX = Math.floor(wallX * texture.width);

          let isSignTexture = (hitType === 3 || hitType === 4 || hitType === 5); 

          if (isSignTexture) {
            
            if ((side === 0 && rayDirX < 0) || (side === 1 && rayDirY > 0)) {
              textureX = texture.width - textureX - 1;
            }
          } else {
            
            if ((side === 0 && rayDirX > 0) || (side === 1 && rayDirY < 0)) {
              textureX = texture.width - textureX - 1;
            }
          }

          if (texture.complete) {
            ctx.drawImage(texture, textureX, 0, 1, texture.height, i, renderH / 2 - wallHeight / 2, STRIP_WIDTH, wallHeight);
          }
        }
      }
    }

    
    function drawCursor() {
      let img = isClicking ? cursor2Texture : cursor1Texture;
      let size = 32;
      let x = canvas.width / 2 - size / 2;
      let y = canvas.height / 2 - size / 2;

      ctx.globalAlpha = canInteract ? 1 : 0.5;
      ctx.drawImage(img, x, y, size, size);
      ctx.globalAlpha = 1;
    }

    function drawNotebook() {
      const iconSize = 60;
      const x = 20;
      const y = 20;

      if (notebookIconTexture.complete) {
        ctx.drawImage(notebookIconTexture, x, y, iconSize, iconSize);
      }

      ctx.fillStyle = "white";
      ctx.font = "48px 'VT323'";
      ctx.textAlign = "left";
      ctx.fillText(`${notebookCount} / ${notebookTotal}`, x + iconSize + 10, y + iconSize - 8);
    }

    function drawInventory() {
      const slotSize = 125;
      const gap = 12;
      const padding = 18;
      const totalWidth = slotSize * 5 + gap * 4 + padding;
      const totalHeight = slotSize + padding;
      const startX = canvas.width - totalWidth - 20;
      const startY = 20;

      
      ctx.fillStyle = "rgba(60, 60, 60, 0.85)";
      ctx.beginPath();
      ctx.roundRect(startX, startY, totalWidth, totalHeight, 10);
      ctx.fill();

      ctx.strokeStyle = "rgba(180, 180, 180, 0.6)";
      ctx.lineWidth = 2;
      ctx.stroke();

      for (let i = 0; i < 5; i++) {
        let x = startX + padding + i * (slotSize + gap);
        let y = startY + padding;

        ctx.fillStyle = (i === selectedSlot) ? "rgba(0, 180, 0, 0.85)" : "rgba(30, 30, 30, 0.8)";
        ctx.beginPath();
        ctx.roundRect(x, y, slotSize, slotSize, 6);
        ctx.fill();

        ctx.strokeStyle = (i === selectedSlot) ? "rgba(100, 255, 100, 0.9)" : "rgba(130, 130, 130, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x, y, slotSize, slotSize, 6);
        ctx.stroke();

        ctx.fillStyle = "rgba(200, 200, 200, 0.5)";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(i + 1, x + 5, y + 16);

        if (inventory[i] !== null) {
          ctx.fillStyle = "white";
          ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(inventory[i], x + slotSize / 2, y + slotSize / 2 + 5);
          ctx.textAlign = "left";
        }
      }
    }

    function drawHp() {
      const heartSize = 120;
      const gap = 12;
      const panelPadding = 14;
      const panelWidth = heartSize * maxHp + gap * (maxHp - 1) + panelPadding * 2;
      const panelHeight = heartSize + panelPadding * 2;
      const panelX = canvas.width - panelWidth - 20;

      const slotSize = 125;
      const invPadding = 18;
      const panelY = 20 + slotSize + invPadding + 8;

      for (let i = 0; i < maxHp; i++) {
        let img = (i < hp) ? heartTexture : heartBrokenTexture;
        let x = panelX + panelPadding + i * (heartSize + gap);
        let y = panelY + panelPadding;
        if (img.complete) {
          ctx.drawImage(img, x, y, heartSize, heartSize);
        }
      }
    }

    
    function loop() {
      move();
      checkInteract();

      
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

      ctx.fillStyle = "#555";
      ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

      castRays();

      
      let barWidth = 400;
      let barHeight = 30;

      ctx.fillStyle = "black";
      ctx.fillRect(20, canvas.height - 40, barWidth, barHeight);

      ctx.fillStyle = "lime";
      ctx.fillRect(20, canvas.height - 40, (stamina / maxStamina) * barWidth, barHeight);

      drawCursor();
      drawNotebook();
      drawInventory();
      drawHp();

      requestAnimationFrame(loop);
    }

    
    let loaded = 0;
    const total = 13;

    function checkLoad() {
      loaded++;
      if (loaded === total) {
        console.log("모든 텍스처 로딩 완료");
        loop();
      }
    }

    wallTexture.onload = checkLoad;
    windowTexture.onload = checkLoad;
    roomDoorTexture.onload = checkLoad;
    roomDoorOpenTexture.onload = checkLoad;
    exitDoorTexture.onload = checkLoad;
    blockedExitTexture.onload = checkLoad;
    cursor1Texture.onload = checkLoad;
    cursor2Texture.onload = checkLoad;
    wall2Texture.onload = checkLoad;
    wall3Texture.onload = checkLoad;
    heartTexture.onload = checkLoad;
    heartBrokenTexture.onload = checkLoad;
    notebookIconTexture.onload = checkLoad;
  </script>

</body>
